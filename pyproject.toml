# Root package used ONLY for the one-command trial:
#   uvx --from git+https://github.com/camilbenameur/guarded-messaging-agent gma-demo
# It bundles shared/, mcp_server/, the red-team tests, the fixtures and the demo
# script into one wheel (mirroring the repo layout under gma_demo/_repo so the
# tests find their fixtures). The services keep their own pyproject.toml.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guarded-messaging-agent"
version = "0.1.0"
description = "Run the send-gate red-team eval and the injection demo in one command."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<2",
    "anthropic>=0.40",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[project.scripts]
gma-demo = "gma_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["gma_demo"]

[tool.hatch.build.targets.wheel.force-include]
"shared/src/shared" = "shared"
"mcp_server/src/mcp_server" = "mcp_server"
"mcp_server/tests" = "gma_demo/_repo/mcp_server/tests"
"tests/fixtures" = "gma_demo/_repo/tests/fixtures"
"scripts/demo.py" = "gma_demo/_repo/scripts/demo.py"
