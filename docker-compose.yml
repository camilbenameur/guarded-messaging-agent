services:
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/store:/store
      - ./data/media:/media
      # faster-whisper model cache (HF_HOME=/models, ingest/Dockerfile)
      # so the STT model isn't re-downloaded on every container start.
      - ./data/models:/models
      # Telethon session (full access to the account). Read-write: Telethon
      # updates it. Create it first with `python -m shared.telegram_login`.
      - ./data/telegram:/telegram
    environment:
      TELEGRAM_SESSION_PATH: /telegram/gma.session

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8808:8808"
    volumes:
      - ./data/store:/store
      - ./data/media:/media
      # Same session as the worker, used only to send after approval. Read-write
      # because Telethon updates it; the bridge serializes access with a lock
      # file next to it.
      - ./data/telegram:/telegram
    environment:
      TELEGRAM_SESSION_PATH: /telegram/gma.session
