[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP tool surface, guardrails, and policies for the messaging-agent MVP."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "mcp>=1.9,<2",
    "anthropic>=0.40",
    "starlette>=0.37",
    # Telegram transport (shared.telethon_bridge), only used with BRIDGE=telegram.
    "telethon>=1.36,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# "../shared/tests" relies on shared/ being a sibling of mcp_server/ (true both
# on the host and inside the container image — see mcp_server/Dockerfile).
testpaths = ["tests", "../shared/tests"]
markers = [
    "redteam: adversarial guardrail eval — every case asserts the send gate holds",
]
