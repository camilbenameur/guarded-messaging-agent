name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HF_HOME: ${{ github.workspace }}/.hf-cache   # faster-whisper model cache

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (ffmpeg decodes OGG/Opus voice notes)
        run: |
          # Static build from GitHub releases first (apt mirrors can stall); apt as a bounded fallback.
          set -e
          if curl -fsSL --retry 3 --max-time 120 -o /tmp/ffmpeg.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            sudo install -m 0755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Cache Whisper model (~460 MB, downloaded on first STT test)
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: whisper-small-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared -e "./ingest[dev]" -e "./mcp_server[dev]"

      - name: Lint
        run: ruff check shared ingest mcp_server

      - name: Ingest + shared tests (STT runs on real fixtures, vision on mocks)
        run: cd ingest && pytest -q

      - name: MCP server tests
        run: cd mcp_server && pytest -q

      - name: Red-team eval (15 adversarial cases against the send gate)
        run: cd mcp_server && pytest -q -m redteam

  # Optional: model-in-the-loop injection eval. Skipped (steps no-op, job stays
  # green) when the ANTHROPIC_API_KEY repository secret is not configured.
  live-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: env.HAS_KEY == 'true'
        run: pip install -e ./shared -e ./mcp_server

      - name: Live-model injection eval (small N, costs a few cents)
        if: env.HAS_KEY == 'true'
        run: python evals/live_injection.py --models claude-haiku-5-5 --trials 1 --out ci

      - name: Note when skipped
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY secret not configured; live eval skipped."
